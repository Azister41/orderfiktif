  <title>Pilih Wilayah Jateng - Radar Order Fiktif</title>

    * {

      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .top-header h1 {

      font-weight: 800;
      line-height: 1.18;
      color: #1A2622;
      margin-bottom: 4px;
    }

      color: #5C6D68;
      line-height: 1.38;
    }

    .search-box {

      width: 100%;

      outline: none;
    }

    .search-input:focus {
      border-color: #274E43;
      background-color: #FFFFFF;
    }

    .slider-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 2px 20px 2px 20px;
      scrollbar-width: none;
    }

    .slider-wrapper::-webkit-scrollbar {
      display: none;
    }

    .region-card {
      flex: 0 0 148px;
      scroll-snap-align: start;
      background-color: #F7F5F2;
      border: 1.5px solid #E3E8E5;
      border-radius: 18px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 3px 10px rgba(30, 43, 39, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90px;
    }

    .region-card.active {
      background-color: #274E43;
      border-color: #274E43;
      color: #FFFFFF;
      box-shadow: 0 6px 14px rgba(39, 78, 67, 0.22);
    }

    .region-type {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.68;
      margin-bottom: 2px;
    }

    .region-name {
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .region-meta {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.85;
    }

    .login-section {
      padding: 0 20px;
    }

    .login-card {
      background-color: #F7F5F2;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(30, 43, 39, 0.05);
    }

    .selected-banner {
      background-color: #E5EDE9;
      color: #274E43;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .selected-tag {
      font-size: 11px;
      font-weight: 700;
      background-color: #D3E1DB;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #2C3B36;
      margin-bottom: 5px;
    }

    .input-pill {
      width: 100%;
      height: 44px;
      background-color: #FFFFFF;
      border: 1.5px solid #E2E7E4;
      border-radius: 999px;
      padding: 0 16px;
      font-size: 13.5px;
      color: #1E2B27;
      outline: none;
    }

    .input-pill:focus {
      border-color: #274E43;
    }

    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap .input-pill {
      padding-right: 54px;
    }

    .toggle-pw {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #274E43;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      height: 46px;
      background-color: #274E43;
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 5px 12px rgba(39, 78, 67, 0.18);
    }

    .btn-guest {
      width: 100%;
      background: none;
      border: none;
      color: #4A5B55;
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #E8ECE9;
      cursor: pointer;
    }

    .btn-guest strong {
      color: #274E43;
    }
    
   <style>

<body>

  <div class="top-header">
    <span class="badge-jateng">JAWA TENGAH • 35 WILAYAH</span>
    <h1>Pilih Area Operasional</h1>
    <p>Geser atau cari kota/kabupatenmu agar radar hanya memuat titik rawan di wilayahmu.</p>
  </div>

  <div class="search-box">
    <input type="text" id="searchRegion" class="search-input" placeholder="Cari kota atau kabupaten (misal: Semarang, Solo)..." oninput="filterRegions()" />
  </div>

  <div class="slider-wrapper" id="regionSlider"></div>

  <div class="login-section">
  <div class="login-card">

  <!-- TOMBOL TAB -->
  <div class="tab-row" style="margin-top:16px">
    <button type="button" id="btnTabLogin" class="active" onclick="showTab('login')">LOGIN</button>
    <button type="button" id="btnTabDaftar" onclick="showTab('daftar')">DAFTAR DRIVER</button>
  </div>

  <!-- TAB LOGIN -->
  <div id="tab-login">

      <div class="field">
        <label>ID DRIVER</label>
        <input type="text" id="idDriver" placeholder="ID DRIVER" required>
      </div>
      <button type="submit" class="btn-primary">MASUK KE RADAR →</button>
    </form>
  </div>

  <!-- TAB DAFTAR -->
  <div id="tab-daftar" style="display:none">
    <div class="field">
      <label>NAMA LENGKAP</label>
      <input type="text" id="dafNama" class="normal" placeholder="Contoh: Budi Santoso">

    <div class="field">
      <label>NO. WA</label>
      <input type="text" id="dafWA" class="normal" placeholder="0812xxxxxxx">
    </div>
    <div class="field">
      <label>ID DRIVER</label>
      <input type="text" id="dafID" placeholder="ID DRIVER">
    </div>
    <button type="button" class="btn-primary" onclick="daftarDriver()">KIRIM PENGAJUAN →</button>
  </div>

</div>

<a class="btn-guest" href="#" onclick="openGuest();return false;">Atau <b>lihat radar tanpa login →</b></a>
    </div>
  </div>

      { id: 'kota-semarang', type: 'Kota', name: 'Semarang', file: 'kota-semarang.html' },

      { id: 'kab-purbalingga', type: 'Kabupaten', name: 'Purbalingga', file: 'kab-purbalingga.html' },

      { id: 'kab-wonosobo', type: 'Kabupaten', name: 'Wonosobo', file: 'kab-wonosobo.html' },

      { id: 'kab-sragen', type: 'Kabupaten', name: 'Sragen', file: 'kab-sragen.html' },
      { id: 'kab-kudus', type: 'Kabupaten', name: 'Kudus', file: 'kab-kudus.html' },

      { id: 'kab-rembang', type: 'Kabupaten', name: 'Rembang', file: 'kab-rembang.html' },
      { id: 'kab-blora', type: 'Kabupaten', name: 'Blora', file: 'kab-blora.html' },
      { id: 'kab-batang', type: 'Kabupaten', name: 'Batang', file: 'kab-batang.html' },
      { id: 'kab-pekalongan', type: 'Kabupaten', name: 'Pekalongan', file: 'kab-pekalongan.html' },
      { id: 'kab-pemalang', type: 'Kabupaten', name: 'Pemalang', file: 'kab-pemalang.html' },
      { id: 'kab-tegal', type: 'Kabupaten', name: 'Tegal', file: 'kab-tegal.html' },
      { id: 'kab-brebes', type: 'Kabupaten', name: 'Brebes', file: 'kab-brebes.html' }
    ];

    let selectedRegion = jatengRegions[0];

    function formatFullName(reg) {
      return `${reg.type === 'Kota' ? 'Kota' : 'Kab.'} ${reg.name}`;
    }
    
async function daftarDriver(){
  var data = {
    nama: document.getElementById('dafNama').value.trim(),
    wa: document.getElementById('dafWA').value.trim(),
    idDriver: document.getElementById('dafID').value.trim().toUpperCase(),
    wilayah: selectedRegion.id,
    status: 'pending',
    createdAt: new Date()
  };
  if(!data.nama || !data.wa || !data.idDriver) return alert('Isi kabeh disik!');
  
  // Simpen neng Firebase
  await db.collection('driver_requests').doc(data.idDriver).set(data);
  alert('Pengajuan dikirim! Tunggu di-ACC Admin yo bolo!');
}

function updateLabels() {
  const fullTitle = formatFullName(selectedRegion);
  var a = document.getElementById('selectedLabel');
  if(a) a.textContent = fullTitle;
  var b = document.getElementById('areaLabel');
  if(b) b.textContent = fullTitle;
  var c = document.getElementById('submitBtn');
  if(c) c.textContent = `Masuk ke Radar ${fullTitle}`;
}

function renderSlider(list) {
  // Cari regionGrid dulu, nek gak ono baru regionSlider (ben 2-2 ne iso)
  const slider = document.getElementById('regionGrid') || document.getElementById('regionSlider');
  if(!slider) return;
  slider.innerHTML = '';
  list.forEach(reg => {
    const isActive = reg.id === selectedRegion.id;
    const card = document.createElement('div');
    card.className = `region-card ${isActive ? 'active' : ''}`;
    card.onclick = () => selectRegion(reg);
    card.innerHTML = `
      <div>
        <div class="region-type">${reg.type}</div>
        <div class="region-name">${reg.name}</div>
      </div>
      <div class="region-meta">${isActive ? 'Terpilih' : 'Pilih area →'}</div>
    `;
    slider.appendChild(card);
  });
}
    function selectRegion(reg) {
      selectedRegion = reg;
      updateLabels();
      filterRegions();
    }

    function filterRegions() {
  // Nek gak ono kotak search, tampillke kabeh wae, ojo error
  const q = (document.getElementById('searchRegion')?.value || '').toLowerCase();
  const filtered = jatengRegions.filter(r =>
    `${r.type} ${r.name}`.toLowerCase().includes(q)
  );
  renderSlider(filtered);
}

    function togglePin() {
      const pin = document.getElementById('pin');
      const btn = document.querySelector('.toggle-pw');
      if (pin.type === 'password') {
        pin.type = 'text';
        btn.textContent = 'Tutup';
      } else {
        pin.type = 'password';
        btn.textContent = 'Lihat';
      }
    }

async function handleLogin(e){
  e.preventDefault();
  var idDriver = document.getElementById('idDriver').value.trim().toUpperCase();
  
  // CEK NENG TABEL DRIVERS (sing wes di-ACC)
  var doc = await db.collection('drivers').doc(idDriver).get();
  if(!doc.exists){
    // CEK NEK IJIK PENDING
    var req = await db.collection('driver_requests').doc(idDriver).get();
    if(req.exists) return alert('ID mu ijik nunggu ACC Admin, sabar yo!');
    return alert('ID ora ketemu! Daftar disik neng tombol DAFTAR!');
  }

  // NEK LOLOS, MLEBU
  localStorage.setItem('radar_driver_id', idDriver);
  localStorage.setItem('regionId', selectedRegion.id);
  window.location.href = 'peta.html';
}

    updateLabels();
    renderSlider(jatengRegions);
    
    function showTab(t){
  document.getElementById('tab-login').style.display = t==='login' ? 'block' : 'none';
  document.getElementById('tab-daftar').style.display = t==='daftar' ? 'block' : 'none';
  document.getElementById('btnTabLogin').classList.toggle('active', t==='login');
  document.getElementById('btnTabDaftar').classList.toggle('active', t==='daftar');
}
    
  </script>
