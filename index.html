<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih Wilayah Jateng - Radar Order Fiktif</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJwwVl16QykhyfJ42LmxU6WClF9Vs5zzw",
      authDomain: "orderfiktif.firebaseapp.com",
      projectId: "orderfiktif",
      storageBucket: "orderfiktif.firebasestorage.app",
      messagingSenderId: "302212019912",
      appId: "1:302212019912:web:8e104f4d4a3f7b017b57fd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #E4ECE9;
      color: #1E2B27;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 0 28px 0;
      overflow-x: hidden;
    }

    .top-header {
      padding: 0 20px;
    }

    .badge-jateng {
      display: inline-block;
      background-color: #D2E0DB;
      color: #274E43;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .top-header h1 {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.18;
      color: #1A2622;
      margin-bottom: 4px;
    }

    .top-header p {
      font-size: 13px;
      color: #5C6D68;
      line-height: 1.38;
    }

    .search-box {
      padding: 0 20px;
    }

    .search-input {
      width: 100%;
      height: 42px;
      background-color: #F7F5F2;
      border: 1.5px solid #D8E2DE;
      border-radius: 999px;
      padding: 0 16px;
      font-size: 13px;
      color: #1E2B27;
      outline: none;
    }

    .search-input:focus {
      border-color: #274E43;
      background-color: #FFFFFF;
    }

    .slider-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 2px 20px;
      scrollbar-width: none;
    }

    .slider-wrapper::-webkit-scrollbar {
      display: none;
    }

    .region-card {
      flex: 0 0 148px;
      scroll-snap-align: start;
      background-color: #F7F5F2;
      border: 1.5px solid #E3E8E5;
      border-radius: 18px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: 0 3px 10px rgba(30, 43, 39, 0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90px;
    }

    .region-card.active {
      background-color: #274E43;
      border-color: #274E43;
      color: #FFFFFF;
      box-shadow: 0 6px 14px rgba(39, 78, 67, 0.22);
    }

    .region-type {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.68;
      margin-bottom: 2px;
    }

    .region-name {
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .region-meta {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.85;
    }

    .login-section {
      padding: 0 20px;
    }

    .login-card {
      background-color: #FFFFFF;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(30, 43, 39, 0.08);
    }

    .area-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #E8F5EE;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    .area-badge b {
      color: #0F3D2E;
    }

    .pill {
      background: #0F3D2E;
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .tab-row {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }

    .tab-row button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #DDD;
      background: #F3F4F6;
      font-weight: 800;
      cursor: pointer;
    }

    .tab-row button.active {
      background: #0F3D2E;
      color: #FFFFFF;
      border-color: #0F3D2E;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #374151;
      margin: 14px 0 6px;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid #E5E7EB;
      font-size: 15px;
      outline: none;
      text-transform: uppercase;
    }

    .field input:focus {
      border-color: #0F3D2E;
    }

    .field input.normal {
      text-transform: none;
    }

    .btn-primary {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #0F3D2E;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-guest {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #374151;
      font-size: 13.5px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="top-header">
    <span class="badge-jateng">JAWA TENGAH • 35 WILAYAH</span>
    <h1>Pilih Area Operasional</h1>
    <p>Geser atau cari kota/kabupatenmu agar radar hanya memuat titik rawan dan peta di wilayahmu.</p>
  </div>

  <div class="search-box">
    <input type="text" id="searchRegion" class="search-input" placeholder="Cari kota atau kabupaten (misal: Semarang, Solo)..." oninput="filterRegions()" />
  </div>

  <div class="slider-wrapper" id="regionSlider"></div>

  <div class="login-section">
    <div class="login-card">
      <div class="area-badge">
        <span>Area: <b id="areaLabel">Kota Semarang</b></span>
        <span class="pill">Jateng</span>
      </div>

      <div class="tab-row">
        <button type="button" id="btnTabLogin" class="active" onclick="showTab('login')">LOGIN</button>
        <button type="button" id="btnTabDaftar" onclick="showTab('daftar')">DAFTAR DRIVER</button>
      </div>

      <div id="tab-login">
        <form onsubmit="handleLogin(event)">
          <div class="field">
            <label for="idDriver">ID DRIVER</label>
            <input type="text" id="idDriver" placeholder="ID DRIVER" required>
          </div>
          <button type="submit" id="btnLoginSubmit" class="btn-primary">MASUK KE RADAR →</button>
        </form>
      </div>

      <div id="tab-daftar" style="display:none">
        <div class="field">
          <label for="dafNama">NAMA LENGKAP</label>
          <input type="text" id="dafNama" class="normal" placeholder="Contoh: Budi Santoso">
        </div>
        <div class="field">
          <label for="dafWA">NO. WA</label>
          <input type="text" id="dafWA" class="normal" placeholder="0812xxxxxxx">
        </div>
        <div class="field">
          <label for="dafID">ID DRIVER</label>
          <input type="text" id="dafID" placeholder="ID Driver">
        </div>
        <button type="button" id="btnDaftarSubmit" class="btn-primary" onclick="daftarDriver()">KIRIM PENGAJUAN →</button>
      </div>
    </div>

    <a class="btn-guest" href="#" onclick="openGuest();return false;">Atau <b>lihat radar tanpa login →</b></a>
  </div>

  <script>
    const jatengRegions = [
      { id: 'kota-semarang', type: 'Kota', name: 'Semarang' },
      { id: 'kab-semarang', type: 'Kabupaten', name: 'Semarang' },
      { id: 'kota-surakarta', type: 'Kota', name: 'Surakarta (Solo)' },
      { id: 'kota-salatiga', type: 'Kota', name: 'Salatiga' },
      { id: 'kota-magelang', type: 'Kota', name: 'Magelang' },
      { id: 'kota-pekalongan', type: 'Kota', name: 'Pekalongan' },
      { id: 'kota-tegal', type: 'Kota', name: 'Tegal' },
      { id: 'kab-kendal', type: 'Kabupaten', name: 'Kendal' },
      { id: 'kab-demak', type: 'Kabupaten', name: 'Demak' },
      { id: 'kab-grobogan', type: 'Kabupaten', name: 'Grobogan' },
      { id: 'kab-banyumas', type: 'Kabupaten', name: 'Banyumas' },
      { id: 'kab-cilacap', type: 'Kabupaten', name: 'Cilacap' },
      { id: 'kab-purbalingga', type: 'Kabupaten', name: 'Purbalingga' },
      { id: 'kab-banjarnegara', type: 'Kabupaten', name: 'Banjarnegara' },
      { id: 'kab-kebumen', type: 'Kabupaten', name: 'Kebumen' },
      { id: 'kab-purworejo', type: 'Kabupaten', name: 'Purworejo' },
      { id: 'kab-wonosobo', type: 'Kabupaten', name: 'Wonosobo' },
      { id: 'kab-magelang', type: 'Kabupaten', name: 'Magelang' },
      { id: 'kab-temanggung', type: 'Kabupaten', name: 'Temanggung' },
      { id: 'kab-boyolali', type: 'Kabupaten', name: 'Boyolali' },
      { id: 'kab-klaten', type: 'Kabupaten', name: 'Klaten' },
      { id: 'kab-sukoharjo', type: 'Kabupaten', name: 'Sukoharjo' },
      { id: 'kab-wonogiri', type: 'Kabupaten', name: 'Wonogiri' },
      { id: 'kab-karanganyar', type: 'Kabupaten', name: 'Karanganyar' },
      { id: 'kab-sragen', type: 'Kabupaten', name: 'Sragen' },
      { id: 'kab-kudus', type: 'Kabupaten', name: 'Kudus' },
      { id: 'kab-jepara', type: 'Kabupaten', name: 'Jepara' },
      { id: 'kab-pati', type: 'Kabupaten', name: 'Pati' },
      { id: 'kab-rembang', type: 'Kabupaten', name: 'Rembang' },
      { id: 'kab-blora', type: 'Kabupaten', name: 'Blora' },
      { id: 'kab-batang', type: 'Kabupaten', name: 'Batang' },
      { id: 'kab-pekalongan', type: 'Kabupaten', name: 'Pekalongan' },
      { id: 'kab-pemalang', type: 'Kabupaten', name: 'Pemalang' },
      { id: 'kab-tegal', type: 'Kabupaten', name: 'Tegal' },
      { id: 'kab-brebes', type: 'Kabupaten', name: 'Brebes' }
    ];

    let selectedRegion = jatengRegions[0];

    function formatFullName(reg) {
      return `${reg.type === 'Kota' ? 'Kota' : 'Kab.'} ${reg.name}`;
    }

    function saveSelectedRegion() {
      localStorage.setItem('radar_wilayah', JSON.stringify(selectedRegion));
      localStorage.setItem('radar_selected_region', selectedRegion.id);
    }

    function goToRegionPage() {
      saveSelectedRegion();
      window.location.href = `wilayah.html?area=${encodeURIComponent(selectedRegion.id)}`;
    }

    function updateLabels() {
      const fullTitle = formatFullName(selectedRegion);
      const areaEl = document.getElementById('areaLabel');
      if (areaEl) areaEl.textContent = fullTitle;
    }

    function renderSlider(list) {
      const slider = document.getElementById('regionSlider');
      if (!slider) return;
      slider.innerHTML = '';
      list.forEach(reg => {
        const isActive = reg.id === selectedRegion.id;
        const card = document.createElement('div');
        card.className = `region-card ${isActive ? 'active' : ''}`;
        card.onclick = () => selectRegion(reg);
        card.innerHTML = `
          <div>
            <div class="region-type">${reg.type}</div>
            <div class="region-name">${reg.name}</div>
          </div>
          <div class="region-meta">${isActive ? 'Terpilih' : 'Pilih area →'}</div>
        `;
        slider.appendChild(card);
      });
    }

    function selectRegion(reg) {
      selectedRegion = reg;
      saveSelectedRegion();
      updateLabels();
      filterRegions();
    }

    function filterRegions() {
      const q = (document.getElementById('searchRegion')?.value || '').toLowerCase();
      const filtered = jatengRegions.filter(r =>
        `${r.type} ${r.name}`.toLowerCase().includes(q)
      );
      renderSlider(filtered);
    }

    function showTab(t) {
      document.getElementById('tab-login').style.display = t === 'login' ? 'block' : 'none';
      document.getElementById('tab-daftar').style.display = t === 'daftar' ? 'block' : 'none';
      document.getElementById('btnTabLogin').classList.toggle('active', t === 'login');
      document.getElementById('btnTabDaftar').classList.toggle('active', t === 'daftar');
    }

    async function daftarDriver() {
      const btn = document.getElementById('btnDaftarSubmit');
      const nama = document.getElementById('dafNama').value.trim();
      const wa = document.getElementById('dafWA').value.trim();
      const idDriver = document.getElementById('dafID').value.trim().toUpperCase();

      if (!nama || !wa || !idDriver) {
        return alert('Isi nama lengkap, no. WA, dan ID driver terlebih dahulu!');
      }

      btn.disabled = true;
      try {
        const existingDriver = await db.collection('drivers').doc(idDriver).get();
        if (existingDriver.exists) {
          alert('ID Driver ini sudah terdaftar dan aktif! Silakan langsung tab LOGIN.');
          showTab('login');
          document.getElementById('idDriver').value = idDriver;
          return;
        }

        await db.collection('driver_requests').doc(idDriver).set({
          nama,
          wa,
          idDriver,
          wilayah: selectedRegion.id,
          wilayahNama: formatFullName(selectedRegion),
          status: 'pending',
          createdAt: new Date()
        });

        alert(`Pengajuan untuk ${formatFullName(selectedRegion)} terkirim! Tunggu di-ACC Admin ya.`);
        document.getElementById('dafNama').value = '';
        document.getElementById('dafWA').value = '';
        document.getElementById('dafID').value = '';
        showTab('login');
      } catch (err) {
        console.error(err);
        alert('Gagal mengirim pengajuan. Cek koneksi atau aturan Firestore.');
      } finally {
        btn.disabled = false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLoginSubmit');
      const idDriver = document.getElementById('idDriver').value.trim().toUpperCase();
      if (!idDriver) return alert('Masukkan ID Driver dulu!');

      btn.disabled = true;
      try {
        const docSnap = await db.collection('drivers').doc(idDriver).get();
        if (!docSnap.exists) {
          const reqSnap = await db.collection('driver_requests').doc(idDriver).get();
          if (reqSnap.exists) {
            return alert('ID kamu masih menunggu ACC Admin. Silakan coba lagi setelah di-ACC.');
          }
          return alert('ID tidak ditemukan! Silakan daftar dulu di tab DAFTAR DRIVER.');
        }

        localStorage.setItem('radar_driver_id', idDriver);
        goToRegionPage();
      } catch (err) {
        console.error(err);
        alert('Gagal memeriksa ID driver. Cek koneksi internet.');
      } finally {
        btn.disabled = false;
      }
    }

    function openGuest() {
      goToRegionPage();
    }

    const savedId = localStorage.getItem('radar_selected_region');
    if (savedId) {
      const found = jatengRegions.find(r => r.id === savedId);
      if (found) selectedRegion = found;
    }

    saveSelectedRegion();
    updateLabels();
    renderSlider(jatengRegions);
  </script>
</body>
</html>
