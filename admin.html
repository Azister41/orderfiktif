<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E4EBE8">
<title>Admin - Radar Order Fiktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fog:#E4EBE8; --paper:#FBF7F4; --well:#EFE8E4;
    --ink:#1D3532; --ink2:#58716D; --line:rgba(29,53,50,.12);
    --spruce:#2E5F57; --spruce-t:#EAF1EE; --bad:#B5304E; --bad-bg:#F6E0E4; --ok:#1F8A4C;
    --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
    --shadow:0 1px 0 #fff inset, 0 14px 26px -16px rgba(29,53,50,.38), 0 2px 6px -2px rgba(29,53,50,.12);
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--fog)}
  body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);background:var(--fog);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
  .screen{max-width:520px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 48px;position:relative}
  .i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .bar{display:flex;justify-content:space-between;align-items:center}
  .round{width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;text-decoration:none;color:var(--ink)}
  .title{font-size:28px;line-height:1.1;font-weight:800;margin-top:14px}
  .sub{color:var(--ink2);margin-top:6px}

  .stats{display:flex;gap:10px;margin-top:18px}
  .stat{flex:1;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat b{display:block;font:800 26px var(--display)}
  .stat span{font-size:12.5px;color:var(--ink2);font-weight:600}
  .stat.hot{background:var(--spruce);color:#fff}
  .stat.hot span{color:#d5e6e1}

  .tabs{display:flex;background:var(--paper);border-radius:999px;padding:4px;margin-top:18px;box-shadow:var(--shadow)}
  .tabs button{flex:1;padding:10px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2)}
  .tabs button.on{background:var(--spruce);color:#fff}
  .tabs em{font-style:normal;margin-left:6px;font-size:12px;background:rgba(0,0,0,.1);border-radius:999px;padding:1px 8px}
  .tabs button.on em{background:rgba(255,255,255,.22)}

  .search{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:999px;padding:0 16px;height:46px;box-shadow:var(--shadow);color:var(--ink2)}
  .search input{flex:1;border:0;outline:0;background:none;height:100%;font-size:15px}

  .list{display:grid;gap:12px;margin-top:14px}
  .card{background:var(--paper);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
  .row{display:flex;gap:12px;align-items:center}
  .av{width:46px;height:46px;border-radius:50%;background:var(--spruce-t);color:var(--spruce);display:grid;place-items:center;font:800 18px var(--display);flex:none}
  .nm{font:700 16.5px var(--display);word-break:break-word}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--spruce-t);color:var(--spruce)}
  .chip.plat{background:#FFF1D6;color:#6B4A00}
  .chip.id{background:var(--well);color:var(--ink);letter-spacing:.03em}
  .wa{margin-top:10px;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px}
  .acts{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;font-weight:700;font-size:14px;text-decoration:none}
  .btn.acc{background:var(--spruce);color:#fff}
  .btn.wa-btn{background:var(--ok);color:#fff}
  .btn.tolak{background:var(--bad-bg);color:var(--bad)}
  .btn.ghost{background:var(--well);color:var(--ink)}
  .btn[disabled]{opacity:.55}
  .note{background:var(--paper);border-radius:18px;padding:18px;text-align:center;color:var(--ink2);box-shadow:var(--shadow)}

  #halamanAdmin{display:none}
  #halamanLogin{max-width:380px;margin:12vh auto 0;background:var(--paper);border-radius:26px;padding:24px;box-shadow:var(--shadow);text-align:center}
  #halamanLogin input{width:100%;padding:14px;border:1.5px solid #cfdad6;border-radius:14px;margin-top:10px;font-size:15px;background:#fff;outline:0}
  #halamanLogin input:focus{border-color:var(--spruce)}
  #halamanLogin .btn{width:100%;margin-top:14px}
  #pesan{margin-top:12px;color:var(--bad);font-weight:600;display:none}
</style>
</head>
<body>
<div class="screen">

  <!-- LOGIN -->
  <div id="halamanLogin">
    <h1 class="title" style="margin-top:0">Login Admin</h1>
    <p class="sub">Hanya akun admin yang bisa masuk.</p>
    <input type="email" id="emailAdmin" placeholder="Email admin" autocomplete="username">
    <input type="password" id="passAdmin" placeholder="Kata sandi" autocomplete="current-password">
    <button class="btn acc" onclick="loginAdmin()">Masuk</button>
    <p id="pesan"></p>
  </div>

  <!-- PANEL -->
  <div id="halamanAdmin">
    <div class="bar">
      <a class="round" href="peta.html#/setelan" aria-label="Kembali ke aplikasi">
        <svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <button class="round" onclick="logoutAdmin()" aria-label="Logout">
        <svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>
      </button>
    </div>
    <h1 class="title">Panel Admin</h1>
    <p class="sub">Kelola pengajuan dan anggota driver.</p>

    <div class="stats">
      <div class="stat hot"><b id="stPending">0</b><span>Menunggu ACC</span></div>
      <div class="stat"><b id="stMember">0</b><span>Anggota aktif</span></div>
    </div>

    <div class="tabs">
      <button id="tabP" class="on" onclick="setTab('pending')">Menunggu<em id="cP">0</em></button>
      <button id="tabM" onclick="setTab('member')">Anggota<em id="cM">0</em></button>
    </div>

    <div class="search" id="searchBox" hidden>
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari nama, ID, no. WA, wilayah" oninput="render()">
    </div>

    <div class="list" id="list"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// UID akun admin (Firebase Console > Authentication > Users). Harus sama dengan di firestore.rules
const ADMIN_UID = "UrwGR11yBNOSCpmxjuWeQlfevJ12";

firebase.initializeApp({
  apiKey: "AIzaSyAJwwVl16QykhyfJ42LmxU6WClF9Vs5zzw",
  authDomain: "orderfiktif.firebaseapp.com",
  projectId: "orderfiktif",
  storageBucket: "orderfiktif.firebasestorage.app",
  messagingSenderId: "302212019912",
  appId: "1:302212019912:web:8e104f4d4a3f7b017b57fd"
});
const auth = firebase.auth();
const db = firebase.firestore();
const $ = (id) => document.getElementById(id);

let pending = [], drivers = new Map(), contacts = new Map();
let tab = 'pending', unsubs = [];

// semua teks dari pengguna dipasang lewat textContent (aman dari XSS)
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function pesan(t){ const p = $('pesan'); p.textContent = t; p.style.display = t ? 'block' : 'none'; }
function prettyWil(id){
  if (!id) return '-';
  return String(id).replace(/^kota-/, 'Kota ').replace(/^kab-/, 'Kab. ').replace(/-/g, ' ')
    .replace(/\b[a-z]/g, (c) => c.toUpperCase()).replace('Kab. ', 'Kab. ').replace('Kota ', 'Kota ');
}
const PLAT = { Shopee: 'ShopeeFood', Gojek: 'Gojek', Grab: 'Grab', Maxim: 'Maxim' };
function platChips(arr, chips){
  (Array.isArray(arr) ? arr : []).forEach((p) => chips.append(el('span', 'chip plat', PLAT[p] || String(p))));
}
function waNum(t){
  let n = String(t || '').replace(/\D/g, '');
  if (!n) return '';
  if (n.startsWith('0')) n = '62' + n.slice(1);
  else if (n.startsWith('8')) n = '62' + n;
  return n;
}

async function loginAdmin(){
  pesan('');
  try { await auth.signInWithEmailAndPassword($('emailAdmin').value.trim(), $('passAdmin').value); }
  catch (e) { console.error(e); pesan('Email atau kata sandi salah.'); }
}
function logoutAdmin(){ auth.signOut(); }

auth.onAuthStateChanged((u) => {
  unsubs.forEach((f) => f()); unsubs = [];
  if (u && u.uid === ADMIN_UID) {
    $('halamanLogin').style.display = 'none';
    $('halamanAdmin').style.display = 'block';
    mulai();
  } else {
    $('halamanAdmin').style.display = 'none';
    $('halamanLogin').style.display = 'block';
    if (u && !u.isAnonymous) { pesan('Akun ini bukan admin.'); auth.signOut(); }
  }
});

function gagal(e){ console.error(e); $('list').replaceChildren(el('div', 'note', 'Gagal memuat. Cek Rules Firestore.')); }

function mulai(){
  unsubs.push(db.collection('driver_requests').where('status', '==', 'pending').onSnapshot((snap) => {
    pending = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    pending.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    render();
  }, gagal));
  unsubs.push(db.collection('drivers').onSnapshot((snap) => {
    drivers = new Map(snap.docs.map((d) => [d.id, d.data()])); render();
  }, gagal));
  unsubs.push(db.collection('driver_contacts').onSnapshot((snap) => {
    contacts = new Map(snap.docs.map((d) => [d.id, d.data()])); render();
  }, gagal));
}

// anggota = gabungan drivers + driver_contacts (data lama masih menyimpan nama/WA di drivers)
function members(){
  const ids = new Set([...drivers.keys(), ...contacts.keys()]);
  return [...ids].map((id) => {
    const d = drivers.get(id) || {}, c = contacts.get(id) || {};
    return { id, nama: c.nama || d.nama || '(tanpa nama)', wa: c.wa || d.wa || '', wilayah: c.wilayah || d.wilayah || '', platform: c.platform || d.platform || [],
             wilayahNama: d.wilayahNama || '' };
  }).sort((a, b) => a.nama.localeCompare(b.nama));
}

function setTab(t){
  tab = t;
  $('tabP').classList.toggle('on', t === 'pending');
  $('tabM').classList.toggle('on', t === 'member');
  $('searchBox').hidden = t !== 'member';
  render();
}

function kartuAnggota(m){
  const c = el('div', 'card');
  const row = el('div', 'row');
  row.append(el('div', 'av', (m.nama.trim()[0] || '?').toUpperCase()));
  const info = el('div');
  info.append(el('div', 'nm', m.nama));
  const chips = el('div', 'chips');
  chips.append(el('span', 'chip id', m.id), el('span', 'chip', m.wilayahNama || prettyWil(m.wilayah)));
  platChips(m.platform, chips);
  info.append(chips);
  row.append(info);
  c.append(row, el('div', 'wa', 'WA: ' + (m.wa || '-')));
  const acts = el('div', 'acts');
  const n = waNum(m.wa);
  if (n) {
    const a = el('a', 'btn wa-btn', 'Chat WA');
    a.href = 'https://wa.me/' + n; a.target = '_blank'; a.rel = 'noopener';
    acts.append(a);
  } else { const b = el('span', 'btn ghost', 'Belum ada nomor'); acts.append(b); }
  const del = el('button', 'btn tolak', 'Hapus');
  del.onclick = () => hapusAnggota(m);
  acts.append(del);
  c.append(acts);
  return c;
}

function kartuPending(d){
  const c = el('div', 'card');
  const row = el('div', 'row');
  row.append(el('div', 'av', (String(d.nama || '?').trim()[0] || '?').toUpperCase()));
  const info = el('div');
  info.append(el('div', 'nm', d.nama));
  const chips = el('div', 'chips');
  chips.append(el('span', 'chip id', d.idDriver), el('span', 'chip', d.wilayahNama || prettyWil(d.wilayah)));
  platChips(d.platform, chips);
  info.append(chips);
  row.append(info);
  c.append(row, el('div', 'wa', 'WA: ' + (d.wa || '-')));
  const acts = el('div', 'acts');
  const acc = el('button', 'btn acc', 'ACC'); acc.onclick = () => accDriver(d.id, acc);
  const tolak = el('button', 'btn tolak', 'Tolak'); tolak.onclick = () => tolakDriver(d.id);
  acts.append(acc, tolak);
  c.append(acts);
  return c;
}

function render(){
  const ms = members();
  $('stPending').textContent = pending.length; $('cP').textContent = pending.length;
  $('stMember').textContent = ms.length; $('cM').textContent = ms.length;
  const list = $('list');
  if (tab === 'pending') {
    list.replaceChildren(...(pending.length ? pending.map(kartuPending) : [el('div', 'note', 'Tidak ada pengajuan. Semua sudah beres.')]));
    return;
  }
  const q = ($('q').value || '').trim().toLowerCase();
  const hasil = ms.filter((m) => !q || (m.nama + ' ' + m.id + ' ' + m.wa + ' ' + prettyWil(m.wilayah) + ' ' + m.wilayahNama).toLowerCase().includes(q));
  list.replaceChildren(...(hasil.length ? hasil.map(kartuAnggota)
    : [el('div', 'note', ms.length ? 'Tidak ada anggota yang cocok.' : 'Belum ada anggota.')]));
}

async function accDriver(id, btn){
  btn.disabled = true;
  try {
    const d = (await db.collection('driver_requests').doc(id).get()).data();
    if (!d) return;
    const batch = db.batch();
    // drivers dibaca saat login, jadi isinya minimal (tanpa nama & WA)
    batch.set(db.collection('drivers').doc(id), {
      idDriver: id, wilayah: d.wilayah, wilayahNama: d.wilayahNama || '', status: 'approved',
      approvedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // kontak disimpan terpisah, hanya admin yang bisa membaca
    batch.set(db.collection('driver_contacts').doc(id), { idDriver: id, nama: d.nama, wa: d.wa, platform: d.platform || [], wilayah: d.wilayah });
    batch.delete(db.collection('driver_requests').doc(id));
    await batch.commit();
  } catch (e) { console.error(e); alert('Gagal ACC. Cek Rules Firestore.'); btn.disabled = false; }
}

async function tolakDriver(id){
  if (!confirm('Yakin tolak ' + id + '?')) return;
  try { await db.collection('driver_requests').doc(id).delete(); }
  catch (e) { console.error(e); alert('Gagal menolak. Cek Rules Firestore.'); }
}

async function hapusAnggota(m){
  if (!confirm('Hapus ' + m.nama + ' (' + m.id + ') dari anggota? ID ini tidak bisa login lagi.')) return;
  try {
    const batch = db.batch();
    batch.delete(db.collection('drivers').doc(m.id));
    batch.delete(db.collection('driver_contacts').doc(m.id));
    await batch.commit();
  } catch (e) { console.error(e); alert('Gagal menghapus. Cek Rules Firestore.'); }
}
</script>
<script>
// tombol kembali: kalau datang dari peta.html, mundur di riwayat (bukan menambah halaman baru)
document.querySelectorAll('a[href^="peta.html#/setelan"]').forEach(function (a) {
  a.addEventListener('click', function (e) {
    if (history.length > 1 && document.referrer.indexOf('peta.html') > -1) { e.preventDefault(); history.back(); }
  });
});
</script>
</body>
</html>
