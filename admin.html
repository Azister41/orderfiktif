<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - ACC Driver</title>
<style>
  body{font-family:sans-serif; padding:16px; background:#f2f2f2}
  .card{background:#fff; padding:14px; margin-bottom:12px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.1)}
  button{padding:10px 14px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-right:8px}
  .acc{background:#16a34a; color:#fff}
  .tolak{background:#dc2626; color:#fff}
  input{width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box}
  #halamanAdmin{display:none}
  #halamanLogin{max-width:400px; margin:60px auto; background:#fff; padding:20px; border-radius:14px; text-align:center}
</style>
</head>
<body>

<!-- HALAMAN 1: KUNCI PASSWORD -->
<div id="halamanLogin">
  <h2>🔐 Login Admin</h2>
  <p>Mek admin sing iso mlebu!</p>
  <input type="password" id="passAdmin" placeholder="Password Admin">
  <button class="acc" style="width:100%" onclick="cekPassword()">MASUK</button>
  <p id="pesanSalah" style="color:red; display:none">Password salah bolo!</p>
</div>

<!-- HALAMAN 2: LIST DRIVER (didhelikne disik) -->
<div id="halamanAdmin">
  <h2>Admin - Pengajuan Driver</h2>
  <button onclick="logoutAdmin()">Logout</button>
  <p>Sing nunggu ACC:</p>
  <div id="list">Loading...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// === GANTI PASSWORD NENG KENE, SAK KAREP ABANG ===
const PASSWORD_ADMIN = '421541';

const firebaseConfig = {
  apiKey: "AIzaSyAJwwVl16QykhyfJ42LmxU6WClF9Vs5zzw",
  authDomain: "orderfiktif.firebaseapp.com",
  projectId: "orderfiktif",
  storageBucket: "orderfiktif.firebasestorage.app",
  messagingSenderId: "302212019912",
  appId: "1:302212019912:web:8e104f4d4a3f7b017b57fd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// CEK PASSWORD
function cekPassword(){
  var p = document.getElementById('passAdmin').value;
  if(p === PASSWORD_ADMIN){
    sessionStorage.setItem('isAdmin', '1');
    tampilkeAdmin();
  } else {
    document.getElementById('pesanSalah').style.display = 'block';
  }
}

function logoutAdmin(){
  sessionStorage.removeItem('isAdmin');
  location.reload();
}

// NEK WES TAU LOGIN, LANGSUNG MLEBU (gak perlu ketik maneh)
if(sessionStorage.getItem('isAdmin') === '1'){
  tampilkeAdmin();
}

function tampilkeAdmin(){
  document.getElementById('halamanLogin').style.display = 'none';
  document.getElementById('halamanAdmin').style.display = 'block';

  // Tampilke sing pending
  db.collection('driver_requests').where('status','==','pending').onSnapshot(snap=>{
    var el = document.getElementById('list');
    if(snap.empty){ el.innerHTML = '<p>Gak ono pengajuan, resik bolo!</p>'; return; }
    var html = '';
    snap.forEach(doc=>{
      var d = doc.data();
      html += '<div class="card">'
        + '<b>'+d.idDriver+'</b> - '+d.nama+'<br>'
        + 'WA: '+d.wa+'<br>'
        + 'Wilayah: '+d.wilayah+'<br><br>'
        + '<button class="acc" onclick="accDriver(\''+doc.id+'\')">✅ ACC</button>'
        + '<button class="tolak" onclick="tolakDriver(\''+doc.id+'\')">❌ TOLAK</button>'
        + '</div>';
    });
    el.innerHTML = html;
  });
}

async function accDriver(id){
  var data = (await db.collection('driver_requests').doc(id).get()).data();
  await db.collection('drivers').doc(id).set({...data, status:'approved'});
  await db.collection('driver_requests').doc(id).delete();
  alert('Driver '+id+' wes di-ACC!');
}

async function tolakDriver(id){
  if(!confirm('Yakin tolak '+id+'?')) return;
  await db.collection('driver_requests').doc(id).delete();
  alert('Driver '+id+' ditolak!');
}
</script>
</body>
</html>
