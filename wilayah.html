<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilih Wilayah - Radar Order Fiktif</title>
<style>
  body{font-family:sans-serif;background:#e8f0e8;margin:0;padding:20px;padding-bottom:100px}
  h1{font-size:26px;margin:0}
  p.sub{opacity:.7;margin-top:4px}
  input{width:100%;padding:14px;border:none;border-radius:999px;margin:18px 0;box-sizing:border-box;font-size:15px}
  .item{background:white;padding:16px;border-radius:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .item.active{border:2px solid #1a5c42;background:#e6f4ec}
  .item b{font-size:16px}
  .item span{font-size:13px;opacity:.6}
  .check{background:#1a5c42;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .btn{position:fixed;bottom:20px;left:20px;right:20px;background:#1a5c42;color:white;border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:bold}
</style>
</head>
<body>

<a href="index.html" style="text-decoration:none;color:#1a5c42;font-weight:bold">← Kembali</a>
<h1 style="margin-top:12px">Pilih Wilayah</h1>
<p class="sub">Pilih kota / kabupaten tempat kamu narik</p>

<input id="cari" placeholder="🔍 Cari kota...  misal: Ungaran, Solo" oninput="tampil()">

<div id="list"></div>

<button class="btn" onclick="simpan()">Simpan Wilayah</button>

<script>
// DAFTAR KOTA - samain sama yang di index.html Mas
const regions = [
  {id:'semarang', name:'Kota Semarang', desc:'Semarang Kota'},
  {id:'kab-semarang', name:'Kab. Semarang', desc:'Ungaran, Ambarawa, Bandungan'},
  {id:'solo', name:'Kota Solo', desc:'Surakarta'},
  {id:'magelang', name:'Kota Magelang', desc:'Magelang Kota'},
  {id:'kab-magelang', name:'Kab. Magelang', desc:'Mungkid, Borobudur'},
  {id:'salatiga', name:'Kota Salatiga', desc:'Salatiga'},
  {id:'kudus', name:'Kab. Kudus', desc:'Kudus'},
  {id:'pati', name:'Kab. Pati', desc:'Pati'},
  {id:'demak', name:'Kab. Demak', desc:'Demak'},
  {id:'kendal', name:'Kab. Kendal', desc:'Kendal'},
];

let selected = localStorage.getItem('wilayahAktif') || 'semarang';

// Baca ?area= dari index.html
const urlArea = new URLSearchParams(window.location.search).get('area');
if(urlArea) selected = urlArea;

function tampil(){
  const q = document.getElementById('cari').value.toLowerCase();
  const list = document.getElementById('list');
  list.innerHTML = '';
  regions.filter(r => (r.name + r.desc).toLowerCase().includes(q)).forEach(r => {
    const div = document.createElement('div');
    div.className = 'item' + (r.id === selected ? ' active' : '');
    div.innerHTML = `<div><b>${r.name}</b><br><span>${r.desc}</span></div><div>${r.id===selected ? '<div class="check">✓</div>' : ''}</div>`;
    div.onclick = () => { selected = r.id; tampil(); };
    list.appendChild(div);
  });
}
tampil();

function simpan(){
  localStorage.setItem('wilayahAktif', selected);
  localStorage.setItem('selectedRegion', selected);
  window.location.href = 'index.html?area=' + encodeURIComponent(selected);
}
</script>
</body>
</html>
